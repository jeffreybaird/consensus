# Staging overlay for the SQLITE stacks (compose.sqlite.yaml / compose.sinatra.yaml).
# Shipped to the droplet as /root/apps/<slug>-stg/compose.override.yaml, which
# Docker Compose merges on top of compose.yaml automatically — so swap.sh, the
# migration runner and `docker compose pull` all pick it up with no flags and no
# staging-specific branches anywhere else.
#
# It exists to keep a pull-request environment away from PRODUCTION BACKUPS.
# Everything else about the stack is deliberately identical to production: the
# same image, the same blue/green swap, the same healthcheck gate.
#
# ON THIS APP THE OVERLAY IS A NO-OP, and that is the correct state: the whole
# of staging's isolation is carried by litestream.staging.yml, copied into the
# staging directory as litestream.yml. It replicates to a path inside the app's
# own volume instead of to Spaces, so `litestream replicate` and the boot-time
# `litestream restore` behave exactly as they do in production while reaching
# nothing outside this environment. A staging deploy therefore needs no Spaces
# credentials at all — none are written into its .env (see staging.yml's
# "Write .env" step, which omits the keypair and every BACKUP_* var).
#
# An override may only ever MODIFY a service compose.yaml already defines.
# Naming one it lacks does not neutralize anything — it defines a new service
# with no image and no build context, and Docker Compose rejects the whole
# project:
#
#     service "<name>" has neither an image nor a build context specified:
#     invalid compose project
#
# That is what a `backup:` block here used to do. This stack has no `backup`
# service to switch off — its only replication is the litestream sidecar, which
# staging redirects by config file rather than by override — so the block
# neutralized nothing and broke every staging deploy at `docker compose pull`.
#
# If a service is ever added to compose.yaml that must not run against
# production data in a PR environment, neutralize it HERE, keeping it present
# rather than removing it: swap.sh asserts that every service compose defines
# actually has a container, and an operator reading `docker compose ps` should
# be able to see why it is idle. The shape that works is a full replacement of
# its entrypoint, inheriting the image from the base file:
#
#     services:
#       <name>:
#         entrypoint: ["/bin/sh", "-c"]
#         command:
#           - |
#             echo "<name>: disabled — this is a staging environment, its data is scratch"
#             while :; do sleep 3600; done
#
# NOT used on the Postgres backend: that stack has no litestream/backup services
# to neutralize (its staging environment is isolated by a separate database in
# the same cluster).
services: {}
